repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/OCA/pylint-odoo
    rev: v10.0.11
    hooks:
      - id: pylint_odoo
        args: [--rcfile=.pylintrc]
  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.2.27
    hooks:
      - id: oca-checks-odoo-module
      - id: oca-checks-po
